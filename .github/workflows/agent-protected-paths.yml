name: agent-protected-paths

# Self-merge suspension gate.
#
# History: the agent was given a rule to open PRs but not merge them.
# That rule is memory-dependent and failed 3 for 3 — see
# docs/five-day-work-guide.md §"Self-merge suspension" for the postmortem.
# Memory-dependent rules decay; this gate is mechanical.
#
# What this gate does:
#   1. Computes the set of files the PR touches.
#   2. If ANY of them is under a "protected" path (db/migrations/**,
#      lib/auth/**, anything money- or consent-related, plus the
#      enforcement tools themselves so they cannot be weakened from
#      inside a single PR), the PR must carry the label
#      `human-approved-merge`. If the label is missing, the gate
#      fails. The agent's token does not have permission to apply
#      that label — see the repo's GitHub label-permissions rules.
#   3. Otherwise passes silently.
#
# Why a label and not the author:
#   The agent and the human share the same GitHub identity today
#   (`saurabh22suman`). Author-based gating cannot distinguish them.
#   Labels can be permission-gated; the agent's token has not been
#   given write access to `human-approved-merge`. If the human ever
#   needs to merge agent-authored PRs touching protected paths, the
#   path is: apply the label, then merge. If the label is missing,
#   the merge attempt is blocked by CI, not by self-restraint.
#
# Failure mode this guard catches:
#   - A PR touching db/migrations/** opened and merged by the agent
#     alone.
#   - A PR touching lib/auth/** opened and merged by the agent alone.
#   - A PR touching the consent, money, or auth surface, opened and
#     merged by the agent alone.
#   - A PR weakening this very workflow or its companion test
#     (caught by the last two protected paths).

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          {
            git diff --name-only --diff-filter=ACMRTUXB "$BASE...$HEAD"
            echo "----- ALWAYS_PROTECTED -----"
            # Belt-and-braces: this workflow and its companion test are
            # ALWAYS in the protected set, regardless of what glob
            # matching below does, so a single PR cannot neuter the
            # gate by editing one of the path strings.
            echo ".github/workflows/agent-protected-paths.yml"
            echo "tests/tier1/agent-protected-paths.test.ts"
          } > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Check protected paths require the human-approved-merge label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Protected paths — see this workflow's header comment for the
          # reason each one is in the set. A change touching ANY of
          # these requires the `human-approved-merge` label.
          PROTECTED_PATHS=(
            "db/migrations/"
            "lib/auth/"
            "lib/money/"
            "db/schema/consent.ts"
            "db/schema/memberships.ts"
            "lib/services/consent"
            "lib/services/membership"
            "lib/services/billing"
            "lib/services/payment"
            "lib/actions/consent"
            "lib/actions/billing"
            "lib/actions/payment"
          )

          touched_protected=0
          while IFS= read -r file; do
            for p in "${PROTECTED_PATHS[@]}"; do
              case "$file" in
                "$p"*)
                  echo "::error file=$file::Touches protected path '$p' — the human-approved-merge label is required."
                  touched_protected=1
                  ;;
              esac
            done
          done < /tmp/changed.txt

          if [ "$touched_protected" -eq 0 ]; then
            echo "No protected paths touched. Gate passes."
            exit 0
          fi

          echo ""
          echo "This PR touches one or more protected paths. Verifying the human-approved-merge label."

          labels_json=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" --jq '.[].name')

          if echo "$labels_json" | grep -qx "human-approved-merge"; then
            echo "Label human-approved-merge present. Gate passes."
            exit 0
          fi

          cat <<'MSG' >&2
::error::This PR touches one or more protected paths and is missing the
`human-approved-merge` label. The label can only be applied by a human;
the agent's token does not have permission to apply it. If you are the
human, apply the label and re-run CI. If you are the agent, this is
the gate firing as designed — open a discussion instead of bypassing.
MSG
          exit 1
