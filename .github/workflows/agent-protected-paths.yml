name: agent-protected-paths

# Self-merge suspension gate.
#
# History: the agent was given a rule to open PRs but not merge
# them. That rule was memory-dependent and failed 3 for 3.
# This gate is the mechanical replacement — but it is ONE LAYER
# of defence, not the only one. Branch protection with required
# reviewers is the second; both must be live. See
# docs/five-day-work-guide.md §"Self-merge suspension".
#
# What this gate does:
#   1. Computes the set of files the PR touches.
#   2. If ANY of them is under a protected path (db/migrations/**,
#      lib/auth/**, lib/money/**, plus the gate workflow and its
#      companion test), the PR must carry the label
#      human-approved-merge. Otherwise the gate fails.
#
# IMPORTANT — what this gate does NOT do:
#   It does not stop the agent from self-applying the label via
#   the GitHub API (verified against this very repo: the agent's
#   token has repo scope and can apply any label). The gate
#   surfaces the issue; the real enforcement is branch
#   protection requiring a human reviewer's approval before
#   merge. Both must be live for self-merge to be impossible.
#
# Why a label and not the author:
#   The agent and the human share the same GitHub identity
#   (saurabh22suman). Author-based gating cannot distinguish
#   them.
#
# Path coverage — every glob below is paired with a semantic
# category in `tests/tier1/agent-protected-paths.test.ts`. The
# test walks the repo for files matching each semantic
# definition (auth, money, consent, children's data) and asserts
# each one is COVERED by at least one glob here. If a future
# file lands in one of those categories without a matching glob
# below, the test fails — and the test also blocks itself from
# being weakened silently (it pins its own path).
#
# The categories are deliberately path-based, not import-based:
#   - The workflow runs before tests, on a bare checkout.
#     `grep -r` over the whole repo at PR time is cheap but
#     fragile; globbing by path is cheaper and reviewable.
#   - Auth/money/consent/children's-data code has stable homes
#     in this repo by convention (see docs/agent-lanes.md and
#     the test's semantic definitions). New code in those
#     categories lands in the same homes; a new home is the
#     change that wants review anyway.

on:
  pull_request:
    # `labeled` + `unlabeled` so the gate re-runs when the human
    # applies (or removes) the human-approved-merge label after the
    # initial PR open. Without these, the gate runs once on the open
    # event, fails, and the human has to trigger a manual re-run
    # after labelling — friction the gate exists to avoid. The
    # `opened`/`synchronize`/`reopened` types stay covered too.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  agent-protected-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --name-only --diff-filter=ACMRTUXB "$BASE...$HEAD" > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Check protected paths require the human-approved-merge label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r file; do
            case "$file" in
              # AUTH — credential issuance, session handling, permission
              # checks. lib/auth/* is the home of session/permission/
              # cookie helpers; lib/actions/platform-auth* is the platform
              # login/verify session lookup; db/platform-auth* is the
              # platform user/session/2FA storage layer; lib/actions/
              # parent-link* and lib/services/parent-link* issue and
              # verify the signed parent-page tokens (a credential); app/
              # api/auth/* is the better-auth catch-all route.
              lib/auth/*) echo "::error file=$file::Touches lib/auth/** (session/permission helpers)."; FAILED=1 ;;
              lib/actions/platform-auth*) echo "::error file=$file::Touches platform auth (login/verify/2FA)."; FAILED=1 ;;
              db/platform-auth*) echo "::error file=$file::Touches platform auth storage (users/sessions/TOTP)."; FAILED=1 ;;
              lib/actions/parent-link*) echo "::error file=$file::Touches parent-link issuance (a credential)."; FAILED=1 ;;
              lib/services/parent-link*) echo "::error file=$file::Touches parent-link signing/verification."; FAILED=1 ;;
              app/api/auth/*) echo "::error file=$file::Touches the better-auth route handler."; FAILED=1 ;;

              # MONEY — paise arithmetic, formatting, schema that holds
              # money columns. *money* and *_paise* are the conventions;
              # lib/money/* is the helper home.
              lib/money/*) echo "::error file=$file::Touches lib/money/** (paise arithmetic/format)."; FAILED=1 ;;
              db/schema/*money*) echo "::error file=$file::Touches a money schema file."; FAILED=1 ;;
              db/schema/*paise*) echo "::error file=$file::Touches a *_paise schema file."; FAILED=1 ;;

              # CONSENT — DPDP-Act tracked state. consent.ts is the
              # schema; service and action layers live alongside.
              db/schema/consent*) echo "::error file=$file::Touches consent schema."; FAILED=1 ;;
              lib/services/consent*) echo "::error file=$file::Touches consent service."; FAILED=1 ;;
              lib/actions/consent*) echo "::error file=$file::Touches consent action."; FAILED=1 ;;

              # CHILDREN'S DATA — surfaces that read or expose data
              # about minors (the subject of DPDP). parent-view is the
              # data-fetch layer for the signed-link parent page;
              # persons/memberships/scheduling carry the underlying
              # rows (members, persons, guardianships, attendance);
              # better-auth owns the credential rows.
              lib/services/parent-view*) echo "::error file=$file::Touches parent-view (children's data)."; FAILED=1 ;;
              db/schema/people.ts) echo "::error file=$file::Touches persons/members/guardianships schema."; FAILED=1 ;;
              db/schema/memberships.ts) echo "::error file=$file::Touches memberships schema."; FAILED=1 ;;
              db/schema/scheduling.ts) echo "::error file=$file::Touches sessions/attendance schema."; FAILED=1 ;;
              db/schema/better-auth.ts) echo "::error file=$file::Touches better-auth credential schema."; FAILED=1 ;;
              db/auth-db.ts) echo "::error file=$file::Touches the better-auth drizzle handle."; FAILED=1 ;;

              # MIGRATIONS — never edit an applied migration; add a new
              # one (CLAUDE.md). Always requires review.
              db/migrations/*) echo "::error file=$file::Touches db/migrations/**."; FAILED=1 ;;

              # GATE ITSELF — the workflow and its companion test pair.
              # Editing either without tripping the gate is the
              # original attack class the gate exists to prevent.
              .github/workflows/agent-protected-paths.yml) echo "::error file=$file::Touches the gate workflow itself."; FAILED=1 ;;
              tests/tier1/agent-protected-paths.test.ts) echo "::error file=$file::Touches the gate's companion test."; FAILED=1 ;;
            esac
          done < /tmp/changed.txt
          if [ "$FAILED" -eq 0 ]; then
            echo "No protected paths touched. Gate passes."
            exit 0
          fi
          echo ""
          echo "This PR touches a protected path. Checking for human-approved-merge label."
          labels_json=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" --jq '.[].name')
          echo "Labels: $labels_json"
          if echo "$labels_json" | grep -qx "human-approved-merge"; then
            echo "Label human-approved-merge present. Gate passes."
            exit 0
          fi
          echo "::error::This PR touches a protected path and is missing the human-approved-merge label. The label alone is NOT sufficient protection — branch protection requiring a human reviewer must also be live before merge. The human reviewer is the real gate; the label is the proof that review happened."
          exit 1
