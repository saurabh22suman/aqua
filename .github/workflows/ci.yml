name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua
          POSTGRES_DB: aqua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app_login:ci-only-app-pw@localhost:5432/aqua
      MIGRATION_DATABASE_URL: postgresql://aqua:aqua@localhost:5432/aqua
      APP_LOGIN_PASSWORD: ci-only-app-pw
      NODE_ENV: test
      # Not a secret, not required for anything to pass — better-auth logs
      # a "you are using the default secret" error (non-fatal; nothing
      # reads it, nothing fails without it) whenever it's unset. Setting
      # it here is purely to keep that noise out of a first-run log
      # someone is reading at 1am. See docs/ci-first-run.md.
      BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret

    steps:
      # fetch-depth: 0 -- M2's lane-overlap check needs origin/<base>
      # to diff against; the default shallow clone doesn't carry it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # M1: fails fast (~1s) on a migration numbering collision or a
      # non-conforming filename, before the ~2min db:reset step below
      # would discover the same problem at runtime. See
      # scripts/check-migration-naming.ts and docs/agent-lanes.md.
      - run: pnpm check:migrations

      # M2: non-blocking by design -- see docs/agent-lanes.md.
      - run: pnpm exec tsx scripts/check-lane-overlap.ts

      # db/reset.ts refuses to run unless DEMO_MODE=true or --i-understand
      # is passed explicitly (see db/reset-guard.ts) — CI's Postgres
      # service is scratch/ephemeral, but the script has no way to know
      # that on its own, so this is an explicit declaration of intent
      # rather than a silent bypass.
      - name: db:reset (bootstrap roles + migrate against the CI Postgres service)
        run: pnpm db:reset -- --i-understand

      # pretest seeds the platform catalogue automatically (see T0).
      #
      # Two Postgres instances are in play here on purpose, not
      # redundantly: the `postgres` service above is the long-lived DB
      # every other test file uses via MIGRATION_DATABASE_URL/DATABASE_URL
      # (fixed connection, matches local `pnpm db:reset` + `pnpm test`).
      # tests/tier1/isolation.test.ts alone spins up its OWN disposable
      # Testcontainers Postgres, because it deliberately drops RLS
      # policies as part of its mutation proofs — doing that against the
      # shared service DB would corrupt state for every other test file
      # running in the same job. Testcontainers needs only the Docker
      # daemon, which GitHub-hosted ubuntu-latest runners provide already
      # (no `services:`/`container:` entry needed for it) — this is the
      # one thing in this workflow that hasn't been observed working on
      # actual GitHub infrastructure yet. See docs/ci-first-run.md.
      - run: pnpm test

      # First-load JS budget (DESIGN.md §5: 150 KB gzipped, per route).
      # No bundlesize/size-limit dependency — parses `next build`'s own
      # summary table. See scripts/check-bundle-budget.ts.
      - run: pnpm exec tsx scripts/check-bundle-budget.ts

      # Font budget (DESIGN.md §1.3: 60 KB, latin subset only, woff2).
      # Runs its own build too (self-contained, same as the bundle check
      # above) — the small duplicate build cost buys a script that's
      # correct standalone regardless of step order.
      - run: pnpm exec tsx scripts/check-font-budget.ts

      # scripts/e2e-offline.ts needs a real Chromium binary — `pnpm install`
      # only installs the `playwright` package, not the browser itself.
      # --with-deps also installs the OS libraries Chromium needs on a bare
      # runner image.
      - run: pnpm exec playwright install --with-deps chromium

      # The offline fixture (scripts/lib/offline-fixture.ts) reuses the
      # demo-academy tenant and coach login user `pnpm seed` creates —
      # same as local dev, not a CI-only bootstrap path.
      - run: pnpm seed

      # Offline attendance sync (S3) — the six VERIFY scenarios from
      # docs/ci-first-run.md's offline section, run for real: network
      # genuinely disabled via Playwright's context.setOffline(), not
      # throttled. Six clean manual runs is not the same as protection;
      # this is that protection. See docs/ci-first-run.md for what a
      # failure here looks like and the one scenario (VERIFY 5, "mid-sync")
      # that's timing-sensitive by nature — its assertions (no duplicates,
      # no losses) hold regardless of exact timing, but the precise
      # "some landed, some didn't" moment it's aiming for isn't guaranteed
      # on a loaded runner.
      - run: pnpm exec tsx scripts/e2e-offline.ts

      # The counterpart: every tenant ships with offline sync OFF by default
      # (OFFLINE_SYNC_ENABLED unset — see lib/feature-flags.ts; issue #4
      # postmortem's kill switch, docs/architecture.md §12.2). Proves the
      # online happy path is unaffected, the offline banner is proactive,
      # and a tap made while offline is refused outright — not silently
      # queued. Own dev server on a different port so it can't collide
      # with the run above if step ordering ever changes.
      - run: pnpm exec tsx scripts/e2e-offline-disabled.ts
