name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua
          POSTGRES_DB: aqua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app_login:ci-only-app-pw@localhost:5432/aqua
      MIGRATION_DATABASE_URL: postgresql://aqua:aqua@localhost:5432/aqua
      APP_LOGIN_PASSWORD: ci-only-app-pw
      NODE_ENV: test
      # Not a secret, not required for anything to pass — better-auth logs
      # a "you are using the default secret" error (non-fatal; nothing
      # reads it, nothing fails without it) whenever it's unset. Setting
      # it here is purely to keep that noise out of a first-run log
      # someone is reading at 1am. See docs/ci-first-run.md.
      BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret
      # scripts/e2e-role-bypass.ts runs next build + next start + a
      # seed with NODE_ENV=production so lib/env.ts's production-mode
      # boot guard (lib/env.ts:66-96) fires for the seed subprocess
      # (next build is exempt via NEXT_PHASE=phase-production-build;
      # next start loads env lazily on first request). The seed
      # imports lib/env.ts eagerly and was crashing on these two
      # required vars. The values here match what the e2e fakes —
      # BETTER_AUTH_URL points at the local port the e2e listens on
      # (BASE = http://127.0.0.1:3220), PARENT_LINK_SECRET mirrors
      # BETTER_AUTH_SECRET's "ci-build-only" pattern since the
      # parent page is never hit by this test.
      BETTER_AUTH_URL: http://127.0.0.1:3220
      PARENT_LINK_SECRET: ci-build-only-not-a-real-secret

    steps:
      # fetch-depth: 0 -- M2's lane-overlap check needs origin/<base>
      # to diff against; the default shallow clone doesn't carry it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # M1: fails fast (~1s) on a migration numbering collision or a
      # non-conforming filename, before the ~2min db:reset step below
      # would discover the same problem at runtime. See
      # scripts/check-migration-naming.ts and docs/agent-lanes.md.
      - run: pnpm check:migrations

      # H3: scripts/seed-demo.ts and docs/demo-runbook.md must move
      # together — drift here is a demo-blocker (operator walkthrough
      # lands on stale numbers). The script is a pure git-diff check,
      # no DB needed; runs in well under a second.
      - run: pnpm check:runbook-sync

      # F5: every script referenced in package.json must point to a
      # file that exists. The E1 follow-up landed a "passing"
      # parent-link zero-script test that was actually a phantom:
      # package.json referenced scripts/e2e-parent-link-zero-js.ts
      # but the file did not exist in any commit and CI never ran
      # it. A passing test is not evidence unless you have seen it
      # run. This check closes that class permanently.
      - run: pnpm check:scripts-exist

      # M2: non-blocking by design -- see docs/agent-lanes.md.
      - run: pnpm exec tsx scripts/check-lane-overlap.ts

      # db/reset.ts refuses to run unless DEMO_MODE=true or --i-understand
      # is passed explicitly (see db/reset-guard.ts) — CI's Postgres
      # service is scratch/ephemeral, but the script has no way to know
      # that on its own, so this is an explicit declaration of intent
      # rather than a silent bypass.
      - name: db:reset (bootstrap roles + migrate against the CI Postgres service)
        run: pnpm db:reset -- --i-understand

      # D2/D3 fallout: db/deploy.ts is the only place that ever bootstraps
      # pg-boss's own schema (pgboss.*, via boss.start() under the
      # privileged MIGRATION_DATABASE_URL — app_user has no CREATE on the
      # schema, see db/deploy.ts's grantAppUserOnPgBossSchema) and grants
      # app_user the read/write it needs on that schema afterward. In a
      # real deploy this always runs before the app serves a request, so
      # createTenant()'s registerSessionsGenerateSchedule() (D2) can
      # assume it. db:reset only runs our own migrations, not this — a
      # fresh CI Postgres never got pgboss.schedule created, and the
      # tests that touch it (platform-tenants-create.test.ts's D2 case,
      # tenant-creation-parity.test.ts) failed with "relation
      # pgboss.schedule does not exist" until this step was added. Run it
      # here for the same reason db:reset runs here: match what a real
      # deploy guarantees before anything downstream depends on it.
      - name: db:deploy (bootstrap pg-boss schema + queues before tests depend on it)
        run: pnpm db:deploy

      # pretest seeds the platform catalogue automatically (see T0).
      #
      # Two Postgres instances are in play here on purpose, not
      # redundantly: the `postgres` service above is the long-lived DB
      # every other test file uses via MIGRATION_DATABASE_URL/DATABASE_URL
      # (fixed connection, matches local `pnpm db:reset` + `pnpm test`).
      # tests/tier1/isolation.test.ts alone spins up its OWN disposable
      # Testcontainers Postgres, because it deliberately drops RLS
      # policies as part of its mutation proofs — doing that against the
      # shared service DB would corrupt state for every other test file
      # running in the same job. Testcontainers needs only the Docker
      # daemon, which GitHub-hosted ubuntu-latest runners provide already
      # (no `services:`/`container:` entry needed for it) — this is the
      # one thing in this workflow that hasn't been observed working on
      # actual GitHub infrastructure yet. See docs/ci-first-run.md.
      - run: pnpm test

      # First-load JS budget (DESIGN.md §5: 150 KB gzipped, per route).
      # No bundlesize/size-limit dependency — parses `next build`'s own
      # summary table. See scripts/check-bundle-budget.ts.
      - run: pnpm exec tsx scripts/check-bundle-budget.ts

      # Font budget (DESIGN.md §1.3: 60 KB, latin subset only, woff2).
      # Runs its own build too (self-contained, same as the bundle check
      # above) — the small duplicate build cost buys a script that's
      # correct standalone regardless of step order.
      - run: pnpm exec tsx scripts/check-font-budget.ts

      # scripts/e2e-offline.ts needs a real Chromium binary — `pnpm install`
      # only installs the `playwright` package, not the browser itself.
      # --with-deps also installs the OS libraries Chromium needs on a bare
      # runner image.
      - run: pnpm exec playwright install --with-deps chromium

      # The offline fixture (scripts/lib/offline-fixture.ts) reuses the
      # demo-academy tenant and coach login user `pnpm seed` creates —
      # same as local dev, not a CI-only bootstrap path.
      - run: pnpm seed

      # Offline attendance sync (S3) — the six VERIFY scenarios from
      # docs/ci-first-run.md's offline section, run for real: network
      # genuinely disabled via Playwright's context.setOffline(), not
      # throttled. Six clean manual runs is not the same as protection;
      # this is that protection. See docs/ci-first-run.md for what a
      # failure here looks like and the one scenario (VERIFY 5, "mid-sync")
      # that's timing-sensitive by nature — its assertions (no duplicates,
      # no losses) hold regardless of exact timing, but the precise
      # "some landed, some didn't" moment it's aiming for isn't guaranteed
      # on a loaded runner.
      - run: pnpm exec tsx scripts/e2e-offline.ts

      # The counterpart: every tenant ships with offline sync OFF by default
      # (OFFLINE_SYNC_ENABLED unset — see lib/feature-flags.ts; issue #4
      # postmortem's kill switch, docs/architecture.md §12.2). Proves the
      # online happy path is unaffected, the offline banner is proactive,
      # and a tap made while offline is refused outright — not silently
      # queued. Own dev server on a different port so it can't collide
      # with the run above if step ordering ever changes.
      - run: pnpm exec tsx scripts/e2e-offline-disabled.ts

      # H1 follow-up — parent-page zero-JS contract. The shipped
      # artifact must contain zero <script> tags. A dev-server
      # assertion is wrong because dev mode bundles differently than
      # `next build`'s output; the test builds and runs `next start`,
      # so what it checks is what a real visitor receives.
      - run: pnpm e2e:parent-link-zero-js

      # H1 follow-up — credential-leak check on every pre-hydration
      # form submit in the platform surface. Three tiers: live submit
      # on the platform login form (JS disabled), live submit on one
      # auth-gated form (JS enabled, manual fetch), and a source scan
      # pinning method="post" on every other form statically.
      - run: pnpm e2e:platform-form-leak

      # A — host boundary. The platform surface lives at ops.<base>;
      # the tenant surface lives at <base>. middleware.ts enforces
      # this in the routing layer; this e2e pins it against future
      # refactors. Spawns its own dev server (port 3222), curls each
      # path with explicit Host headers, asserts 200 vs 404 against
      # the surface contract. See middleware.ts and
      # scripts/e2e-host-boundary.ts for the rules and the probes.
      - run: pnpm e2e:host-boundary

      # D1 — role-bypass attack e2e. Builds production, starts next
      # start, logs in as owner/coach/receptionist via the real OTP
      # flow, replays the three attack shapes (plain GET, RSC + Next-
      # Router-State-Tree claiming the (owner) layout is mounted,
      # POST with Next-Action against every action hash in the
      # server-reference-manifest), and asserts no protected data
      # (member names, dateOfBirth, dashboard figures) leaks to a
      # role that isn't entitled to the surface. The positive
      # control (entitled role receives the data via the same
      # shapes) gates false negatives — every shape is a real
      # request the application services. See scripts/e2e-role-
      # bypass.ts for the rule the auditor broke and the assertions
      # this test pins. PR D2 lands the fix; PR D1 is the red
      # baseline.
      - run: pnpm e2e:role-bypass
