name: deploy-dev

# The SSH deployment path is retired: Dokploy Compose owns Dev. Keep this
# workflow so existing publish-completed triggers are visibly skipped while
# DEV_DEPLOY_ENABLED is unset; setting that legacy variable fails safely
# instead of bringing up a second stack on the same VPS.
on:
  workflow_run:
    workflows: [publish]
    types: [completed]

jobs:
  retired-ssh-deploy:
    if: vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "DEV_DEPLOY_ENABLED must remain unset. Deploy Dev via tracked Dokploy Compose (docs/deployment.md)."
          exit 1
