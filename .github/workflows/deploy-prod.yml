name: deploy-prod

# PR1-C12 — production is manual, immutable and gated.
#
#   * workflow_dispatch ONLY: no push, no pull_request, no workflow_run.
#     A human types the immutable sha-<short> tag that publish.yml
#     pushed; a branch name or `latest` is refused before anything runs.
#   * environment: production — GitHub holds the run for the configured
#     environment approval before any step executes.
#   * PILOT_RELEASE_GATE: the gate job fails until the repository
#     variable is set to `passed`, which happens only after the complete
#     PR3 release gate in docs/pilot-release-checklist.md is checked.
#     Never trigger production before that.
#   * Same deploy → verify-tag → health-gate sequence as dev; rollback
#     is dispatching this workflow again with an older tag.
#
# Secrets (environment: production): PROD_SSH_KEY, PROD_HOST, PROD_USER,
# PROD_APP_DIR, PROD_HEALTH_URL.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable tag published by publish.yml (sha-<short>)"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: PR3 release gate must have passed
        if: vars.PILOT_RELEASE_GATE != 'passed'
        run: |
          echo "Production is blocked until the complete PR3 release gate in docs/pilot-release-checklist.md passes."
          echo "Set the repository variable PILOT_RELEASE_GATE=passed after that gate is fully checked."
          exit 1

      - name: Validate the immutable tag
        run: |
          TAG="${{ inputs.image_tag }}"
          case "$TAG" in
            sha-[0-9a-f]*) ;;
            *) echo "refusing mutable ref '$TAG' — pass a sha-<short> tag published by publish.yml"; exit 1 ;;
          esac
          echo "tag accepted: $TAG"

  deploy:
    needs: gate
    environment: production
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ inputs.image_tag }}
    steps:
      - name: Install the deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy that exact tag (no rebuild)
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          DEPLOY_DIR: ${{ secrets.PROD_APP_DIR }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && IMAGE='$IMAGE' TAG='$TAG' REGISTRY_USER='$REGISTRY_USER' REGISTRY_TOKEN='$REGISTRY_TOKEN' ./deploy.sh"

      - name: Verify the deployed tag is the published tag
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          running=$(ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "docker inspect --format '{{.Config.Image}}' aqua-web")
          echo "running: $running"
          case "$running" in
            *":$TAG") echo "deployed tag matches $TAG" ;;
            *) echo "deployed image '$running' does not match published tag $TAG"; exit 1 ;;
          esac

      - name: Health gate (worker heartbeat included)
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "${{ secrets.PROD_HEALTH_URL }}/api/health" | grep -q '"status":"ok"'; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "health gate failed — the deployed tag is not healthy"
          exit 1
