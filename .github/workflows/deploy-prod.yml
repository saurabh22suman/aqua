name: deploy-prod-approval

# Manual approval of a published image for the tracked Production Dokploy
# Compose path. This workflow NEVER deploys or contacts a VPS. The human
# performs the separate Dokploy Compose deploy after the approval; see
# docs/deployment.md. No SSH script or VPS-only Compose is involved.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published, immutable sha-<12 hex characters> image tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-approval
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.image_tag }}
    steps:
      - name: Release gate and exact published tag format
        env:
          PILOT_RELEASE_GATE: ${{ vars.PILOT_RELEASE_GATE }}
        run: |
          if [ "$PILOT_RELEASE_GATE" != passed ]; then
            echo "Production remains blocked until the complete pilot release gate is verified by the human."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^sha-[0-9a-f]{12}$ ]]; then
            echo "Refusing an invalid or mutable image tag. Require sha-<12 lowercase hex>."
            exit 1
          fi
          echo "Tag format accepted: $TAG. Human must verify the published GHCR digest and Dev evidence."

  approval:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ inputs.image_tag }}
    steps:
      - name: Manual Dokploy Production handoff (no deployment in this job)
        run: |
          echo "Approval recorded for $TAG. This workflow does not deploy."
          echo "Human: resolve $TAG to its GHCR manifest digest, verify it matches the Dev-tested image, then set AQUA_IMAGE_DIGEST in the separate Production Dokploy Compose project."
          echo "Deploy tracked docker-compose.production.yml and check image digest, /api/health, worker, hosts and restore readiness per docs/deployment.md."
