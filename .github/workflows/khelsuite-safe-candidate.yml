name: KhelSuite safe candidate verification

on:
  push:
    branches: [codex/verify-khelsuite-20261111]

permissions:
  contents: read
  actions: read
  checks: read

env:
  AQUA_NO_DOTENV: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  BETTER_AUTH_TELEMETRY: "false"

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Describe verification limits
        run: |
          echo 'This is not a full integration gate. The same candidate must also pass the normal full typecheck and test:sharded, plus all other required CI checks.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Runtime TypeScript
        run: |
          cat > tsconfig.hosted-runtime.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": ["next-env.d.ts", "middleware.ts", "next.config.ts", "app/**/*.ts", "app/**/*.tsx", "components/**/*.ts", "components/**/*.tsx", "lib/**/*.ts", "lib/**/*.tsx", "db/**/*.ts", "worker/**/*.ts"]
          }
          JSON
          pnpm exec tsc --project tsconfig.hosted-runtime.json --noEmit
      - name: Runtime lint
        run: pnpm exec eslint app components lib db worker middleware.ts --max-warnings=0
      - name: Migration names
        run: pnpm check:migrations
      - name: Focus contrast
        run: pnpm check:focus-contrast
      - name: Tenant conventions
        run: pnpm check:tenant-conventions

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: hosted-fixture-owner
          POSTGRES_DB: aqua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app_login:hosted-fixture-app@127.0.0.1:5432/aqua
      MIGRATION_DATABASE_URL: postgresql://aqua:hosted-fixture-owner@127.0.0.1:5432/aqua
      APP_LOGIN_PASSWORD: hosted-fixture-app
      BETTER_AUTH_SECRET: synthetic-hosted-checks-auth-key-for-ci-only
      BETTER_AUTH_URL: http://127.0.0.1:3220
      PARENT_LINK_SECRET: synthetic-hosted-checks-parent-key-for-ci-only
      WHATSAPP_PROVIDER: disabled
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Build runtime image and check tooling
        run: |
          docker build -t khelsuite-verification:local .
          test "$(docker image inspect khelsuite-verification:local --format '{{.Config.User}}')" = aqua
          docker run --rm --network none --entrypoint sh khelsuite-verification:local -c 'pg_dump --version | grep -q "PostgreSQL) 16\." && test -f scripts/db-backup.ts && test -f scripts/lib/db-backup.ts && test -f scripts/enrol-ops-authenticator.ts'
      - name: Apply migrations to the disposable Postgres service
        run: pnpm db:deploy
      - name: Backup dry run
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e MIGRATION_DATABASE_URL -e APP_LOGIN_PASSWORD \
            -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e PARENT_LINK_SECRET \
            -e AQUA_NO_DOTENV -e WHATSAPP_PROVIDER -e NODE_ENV=production \
            --entrypoint node_modules/.bin/tsx \
            khelsuite-verification:local scripts/db-backup.ts --dry-run

  full-ci-evidence:
    needs: [source, runtime-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Require full CI for this exact candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/check-full-ci-evidence.ts
