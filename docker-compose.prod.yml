# Production compose: local verification AND the Dokploy deployment.
#
# Every secret and password is `${VAR:-local-fallback}`:
# - Local (`docker compose -f docker-compose.prod.yml up --build`):
#   fallbacks apply (or the repo-root .env, which Compose auto-loads
#   — every password is derived from a single variable, so whatever
#   the source, all services stay consistent with each other).
#   Zero setup, same as before.
# - Dokploy: Compose deployments do NOT inherit Dokploy environment
#   variables automatically — each service references them explicitly
#   below. Set the real values as Dokploy environment variables:
#     POSTGRES_PASSWORD, APP_LOGIN_PASSWORD, BETTER_AUTH_SECRET,
#     BETTER_AUTH_URL (https://<base>), PARENT_LINK_SECRET
#   (Generate per docs/deployment.md step 0c. Passwords must be
#   URL-safe — they are interpolated raw into connection strings.)
#
# lib/env.ts requires BETTER_AUTH_SECRET, BETTER_AUTH_URL and
# PARENT_LINK_SECRET in every NODE_ENV=production process (migrate,
# web AND worker — the worker parses env too), and fail-fasts when
# APP_LOGIN_PASSWORD disagrees with the DATABASE_URL password, so
# all three services carry the full set.
#
# Explicit project name: without it, Compose defaults to the directory
# name ("aqua") for BOTH this file and the plain dev docker-compose.yml,
# and treats them as the same project. Running this file previously
# reconciled away the dev compose's fixed-named `aqua-db` container
# (removed and recreated) — no data was lost only because its volume
# (`aqua_aqua-pgdata`) has a different name than this file's
# (`aqua-pgdata-prod`), but it was a genuine near-miss. This name keeps
# the two projects, and their container/network namespaces, from ever
# overlapping again.
name: aqua-prod

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqua}
      POSTGRES_DB: aqua
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqua -d aqua"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aqua-pgdata-prod:/var/lib/postgresql/data

  # One-shot: bootstrap roles, run migrations, bootstrap pg-boss's schema
  # and per-tenant schedules, grant app_user access to it. Runs under the
  # privileged role and exits — web/worker never see MIGRATION_DATABASE_URL
  # (tests/tier1/no-superuser-on-request-path.test.ts enforces that at the
  # source level).
  migrate:
    build: .
    command: ["node_modules/.bin/tsx", "db/deploy.ts"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://aqua:${POSTGRES_PASSWORD:-aqua}@db:5432/aqua
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-local-compose-verification-pw}
      DATABASE_URL: postgresql://app_login:${APP_LOGIN_PASSWORD:-local-compose-verification-pw}@db:5432/aqua
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-verification-secret-not-real}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PARENT_LINK_SECRET: ${PARENT_LINK_SECRET:-local-compose-verification-parent-secret-not-real}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    environment:
      # Next standalone binds HOSTNAME when set; without it, it binds
      # the container hostname (eth0) only, and localhost/127.0.0.1
      # inside the container refuses — including the healthcheck
      # below. The container then reads healthy from the outside
      # while Docker marks it unhealthy.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://app_login:${APP_LOGIN_PASSWORD:-local-compose-verification-pw}@db:5432/aqua
      # Set (not just embedded above) so lib/env.ts fail-fasts on drift
      # with a clear message instead of a bare Postgres auth failure.
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-local-compose-verification-pw}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-verification-secret-not-real}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PARENT_LINK_SECRET: ${PARENT_LINK_SECRET:-local-compose-verification-parent-secret-not-real}
      OFFLINE_SYNC_ENABLED: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["node_modules/.bin/tsx", "worker/index.ts"]
    environment:
      DATABASE_URL: postgresql://app_login:${APP_LOGIN_PASSWORD:-local-compose-verification-pw}@db:5432/aqua
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-local-compose-verification-pw}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-verification-secret-not-real}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PARENT_LINK_SECRET: ${PARENT_LINK_SECRET:-local-compose-verification-parent-secret-not-real}
      # Explicit, not just inherited from the image's ENV NODE_ENV=production
      # (Dockerfile) — the worker is a plain node process, not something
      # Next's CLI sets this for automatically the way `next start` does
      # for web. Silently running in development mode here is a real trap
      # (D2 audit finding).
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  aqua-pgdata-prod:
