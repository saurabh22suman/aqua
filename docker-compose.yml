services:
  db:
    image: postgres:16
    container_name: aqua-db
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: aqua
      POSTGRES_DB: aqua
    ports:
      - "5432:5432"
    volumes:
      - aqua-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqua -d aqua"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aqua-pgdata:
