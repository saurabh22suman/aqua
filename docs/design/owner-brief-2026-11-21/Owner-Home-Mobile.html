*{box-sizing:border-box}
body{margin:0}
button,a{touch-action:manipulation}
button{font:inherit;color:inherit}
button:enabled{cursor:pointer}
button:disabled{cursor:wait}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:active:not(:disabled){filter:brightness(.93)}
a{color:inherit}
button svg{flex:none}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.icon{width:19px;height:19px;display:block;flex:none}
.small-icon{width:15px;height:15px}
.sr-only,.skip:not(:focus){position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip:focus{position:fixed;z-index:30;top:10px;left:10px;padding:10px;background:var(--paper);border-radius:8px}
.topbar{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--canvas);border-bottom:1px solid var(--line)}
.toprow,.main,.dock-inner{width:min(100%,570px);margin-inline:auto}
.toprow{height:59px;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:0 15px}
.wordmark{display:inline-flex;align-items:center;gap:7px;font-size:21px;font-weight:800;letter-spacing:-.075em;white-space:nowrap}
.mark{width:29px;height:29px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark .icon{width:17px;height:17px}
.scope{min-height:44px;min-width:0;max-width:57%;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:0 9px;font-size:12px;font-weight:750}
.scope span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope .pin{color:var(--accent)}
.main{padding:11px 13px calc(var(--dock) + 17px)}
.mast{min-height:107px;display:flex;align-items:flex-end;position:relative;isolation:isolate;overflow:hidden;padding:13px 16px;border-radius:13px;color:white;background:var(--mast);margin-bottom:11px}
.mast::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--mast) 0%,color-mix(in srgb,var(--mast) 94%,transparent) 26%,transparent 92%),linear-gradient(0deg,color-mix(in srgb,var(--mast) 48%,transparent),transparent 54%),var(--art) right 56%/cover}
.mast h1{font:700 clamp(33px,9.8vw,44px)/.97 "Brief Display","Brief Sans",sans-serif;letter-spacing:-.018em;overflow-wrap:anywhere}
.mast p{font-size:12px;font-weight:650;margin-bottom:5px;color:#ecf5ef}
.content{display:grid;gap:11px}
.ledger,.block,.exception{border:1px solid var(--line);border-radius:13px;background:var(--paper);min-width:0}
.ledger{padding:13px 13px 0}
.ledger-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ledger h2,.area-title{font-size:17px;line-height:1.2;font-weight:800;letter-spacing:-.035em}
.quiet-link{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0;border:0;background:none;color:var(--accent);font-size:12px;font-weight:750;text-align:left}
.quiet-link:hover{text-decoration:underline;text-underline-offset:2px}
.received{padding:2px 0 13px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.metric-label,.secondary{color:var(--muted);font-size:12px;font-weight:600}
.major{font-size:clamp(31px,9vw,43px);letter-spacing:-.065em;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.today{text-align:right;min-width:44px;flex:none}
.today strong,.balance strong,.site-money{font-size:18px;font-weight:800;line-height:1.15;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.today strong{display:block}
.balance{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.balance strong{overflow-wrap:anywhere}
.invoice-action{margin:0 -13px;border-top:1px solid var(--warning-line);background:var(--warning);color:var(--warning-ink);padding:11px 13px 12px;border-radius:0 0 12px 12px;display:grid;gap:7px}
.issue-face{display:grid;grid-template-columns:31px minmax(0,1fr);align-items:start;gap:9px}
.issue-icon{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;background:#eddbbf;color:var(--warning-ink)}
.issue-face strong{display:block;font-size:14px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.issue-face p{font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.primary,.solid{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:44px;width:max-content;max-width:100%;padding:0 12px;border:1px solid transparent;border-radius:8px;font-size:12px;font-weight:800;text-align:left}
.primary{background:#6c431e;color:white}
.solid{background:var(--accent);color:var(--accent-ink)}
.invoice-action .primary,.exception .primary{margin-left:40px}
.invoice-action.secondary-action{background:var(--paper);color:var(--ink);border-color:var(--line)}
.secondary-action .issue-icon{background:var(--warning)}
.exception{padding:12px;display:grid;gap:8px;border-color:var(--warning-line);background:var(--warning);color:var(--warning-ink)}
.normal-note{border-top:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:7px;color:var(--accent);font-size:12px;font-weight:700}
.block-title{padding:11px 12px 4px}
.row{width:100%;display:flex;align-items:center;gap:9px;min-height:51px;text-align:left;padding:9px 12px;border:0;background:none}
.row + .row{border-top:1px solid var(--line)}
@media(hover:hover){.row:hover,.picker-option:hover{background:var(--soft)}}
.row-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--accent);flex:none}
.row-copy{min-width:0;flex:1}
.row-copy strong{display:block;font-size:13px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}
.row-copy .secondary{display:block;margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.row .tail{color:var(--muted)}
.block .row:last-child{border-radius:0 0 12px 12px}
.facilities-toggle{border-radius:12px!important}
.facilities-toggle[aria-expanded="true"]{border-radius:12px 12px 0 0!important;border-bottom:1px solid var(--line)}
.facilities-toggle[aria-expanded="true"] .tail{transform:rotate(180deg)}
.facilities .row-copy .secondary{font-size:11px}
.site-money{text-align:right;font-size:14px;min-width:44px}
.site-money span{display:block;font-size:10px;color:var(--muted);letter-spacing:0;margin-top:2px}
.session-time{font:700 21px/1 "Brief Display",sans-serif;color:var(--accent);width:42px;flex:none}
.muted-row{padding:8px 12px 12px;color:var(--muted);font-size:12px}
.net{border:1px solid var(--warning-line);background:var(--warning);border-radius:10px;padding:8px 10px;color:var(--warning-ink);font-size:12px;max-width:544px;margin:0 max(13px,calc((100% - 544px) / 2)) 8px;overflow-wrap:anywhere}
.net button{margin-left:7px}
:root:has(#network:not([hidden])){scroll-padding-block-start:calc(var(--toolbar) + 96px)}
.net[data-type="pending"]{border-color:var(--line);background:var(--soft);color:var(--ink)}
.dock{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);min-height:var(--dock);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:5px 7px}
.dock button{min-height:50px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:11px;font-weight:700;line-height:1.15;border-radius:8px;border:0;background:none;color:var(--muted);padding:4px 0}
.dock button[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:800}
.dock .icon{width:18px;height:18px}
dialog{border:1px solid var(--line);border-radius:16px 16px 0 0;background:var(--paper);color:var(--ink);width:min(100%,570px);max-width:none;max-height:85dvh;position:fixed;inset:auto 0 0;margin:0 auto;padding:0;overscroll-behavior:contain;overflow:auto}
dialog[open]{animation:enter-sheet 175ms ease-out both}
dialog::backdrop{background:#12241f70}
body:has(dialog[open]){overflow:hidden}
.sheet-head{position:sticky;top:0;background:var(--paper);z-index:1;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 13px;border-bottom:1px solid var(--line);touch-action:pan-x}
.sheet-head h2{font-size:19px;font-weight:800;letter-spacing:-.035em;overflow-wrap:anywhere}
.sheet-grip{width:28px;height:3px;background:var(--line);border-radius:3px;margin-bottom:5px}
.icon-button{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.sheet-body{padding:10px 13px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-copy{font-size:13px;color:var(--muted);margin:4px 0 10px}
.picker-option{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);text-align:left;background:var(--paper);padding:7px 9px;font-size:14px;font-weight:700}
.picker-option[aria-current="true"]{background:var(--soft);color:var(--accent)}
.sheet-list{list-style:none;margin:0;padding:0}
.sheet-list li{display:flex;justify-content:space-between;align-items:flex-start;gap:11px;padding:9px 1px;border-bottom:1px solid var(--line);font-size:13px}
.sheet-list li span:last-child{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.sheet-list li small{display:block;color:var(--muted);margin-top:2px}
.choices{display:grid;gap:6px;margin-top:6px}
.choice{min-height:44px;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px;font-weight:700}
.choice[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.demo-title{font-size:14px;margin-top:13px;font-weight:750}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:11px}
.chart button{display:grid;gap:3px;grid-template-rows:88px auto;align-items:stretch;min-width:0;min-height:44px;padding:3px 1px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:center;font-size:11px}
.chart button[aria-pressed="true"]{background:var(--soft);border-color:var(--line)}
.chart-plot{position:relative;margin-inline:3px;border-bottom:1px solid var(--line)}
.chart-bar{position:absolute;bottom:0;left:0;right:0;margin-inline:auto;width:68%;background:var(--accent);border-radius:4px 4px 0 0}
.collection-selected{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:13px;margin-top:8px}
.changed{animation:content-change 160ms ease-out both}
@keyframes enter-sheet{from{transform:translateY(18px);opacity:.64}to{transform:translateY(0);opacity:1}}
@keyframes content-change{from{transform:translateY(3px);opacity:.65}to{transform:translateY(0);opacity:1}}
@media(min-width:570px){.main{padding-inline:18px}.mast{min-height:128px}.toprow{padding-inline:18px}.scope{max-width:60%}}
@media(max-width:350px){.main{padding-inline:9px}.toprow{padding-inline:10px}.wordmark{font-size:19px}.scope{font-size:11.5px}.scope .pin{display:none}.mast{padding-inline:13px}.ledger{padding-inline:11px}.invoice-action{margin-inline:-11px;padding-inline:11px}.site-money{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to Home</a>
<header class="topbar"><div class="toprow">
  <span class="wordmark"><span class="mark" id="mark"></span>khelsuite.</span>
  <button type="button" class="scope" id="scope" data-action="scope" aria-haspopup="dialog"></button>
</div><div id="network" class="net" hidden></div></header>
<main id="main" class="main" tabindex="-1">
  <header class="mast"><div>
    <p><time datetime="2026-11-21">Saturday, 21 November</time></p>
    <h1 id="club"></h1>
  </div></header>
  <div id="content" class="content"></div>
</main>
<nav class="dock" aria-label="Owner navigation"><div class="dock-inner" id="dock"></div></nav>
<p class="sr-only" id="announce" role="status" aria-atomic="true"></p>
<dialog id="sheet" aria-labelledby="sheet-title">
  <header class="sheet-head" id="sheet-head">
    <div><div class="sheet-grip" aria-hidden="true"></div><h2 id="sheet-title"></h2></div>
    <button type="button" class="icon-button" data-action="close" aria-label="Close"></button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>
<script>
"use strict";
const $ = selector => document.querySelector(selector);
const icons={
 mark:'<path d="m2 16 8-12m1 12 8-12" stroke-width="3"/>',
 pin:'<path d="M17 8c0 4-6 9-7 10-1-1-7-6-7-10a7 7 0 0 1 14 0Z"/><circle cx="10" cy="8" r="2"/>',
 down:'<path d="m5 8 5 5 5-5"/>',
 right:'<path d="m8 5 5 5-5 5"/>',
 arrow:'<path d="M3 10h13m-5-5 5 5-5 5"/>',
 alert:'<path d="m10 2 8 15H2L10 2Zm0 6v3m0 3h.01"/>',
 check:'<path d="m4 10 4 4 8-8"/>',
 cross:'<path d="m5 5 10 10M15 5 5 15"/>',
 site:'<rect x="2" y="3" width="6" height="6" rx="1"/><rect x="12" y="3" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/>',
 home:'<path d="m2.5 9 7.5-6.5L17.5 9v8H12v-5H8v5H2.5z"/>',
 talk:'<path d="M4 4h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-6l-5 3v-3H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M6 7h8m-8 3h5"/>',
 schedule:'<rect x="2.5" y="4.5" width="15" height="13" rx="1.5"/><path d="M6.5 2.5v4m7-4v4m-11 2.5h15"/>',
 people:'<circle cx="7" cy="6" r="2.5"/><path d="M2 16v-1a5 5 0 0 1 10 0v1m2-12a2.5 2.5 0 0 1 0 5m1 2a5 5 0 0 1 3 4v1"/>',
 dots:'<circle cx="4" cy="10" r="1"/><circle cx="10" cy="10" r="1"/><circle cx="16" cy="10" r="1"/>'
};
const icon=(name,small=false)=>`<svg aria-hidden="true" class="icon${small?' small-icon':''}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
const currency=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",minimumFractionDigits:0,maximumFractionDigits:0});
const money=paise=>paise>0&&paise<50?"Under ₹1":currency.format(paise/100);
const clubs={
 pool:{name:"Aqua Worli",sites:{main:"Worli Main",other:"Worli Annexe"},session:"Junior squad",coach:"Coach Bhaskar"},
 court:{name:"Baseline Racquet",sites:{main:"Indiranagar",other:"Whitefield"},session:"Junior badminton",coach:"Coach Maya"}
};
const invoices={
 main:[["INV-0182",500000,3],["INV-0195",720000,3],["INV-0203",1100000,2],["INV-0211",1485650,1]],
 other:[["INV-0188",850000,2],["INV-0191",1150000,1]]
};
const state={sport:"pool",scope:"all",scenario:"dues",opening:false,bySite:false,failNext:false,failedScope:null,bucket:5};
const scenarioNames={dues:"Overdue balances",cash:"Cash discrepancy",quiet:"Quiet day",offline:"Facility switch fails once"};
const dates=["15 Nov","16 Nov","17 Nov","18 Nov","19 Nov","20 Nov","21 Nov"];
const club=()=>clubs[state.sport];
const siteName=(id=state.scope)=>id==="all"?"All facilities":club().sites[id];
const siteIds=(scope=state.scope)=>scope==="all"?["main","other"]:[scope];
const invoiceRows=(scope=state.scope)=>state.scenario==="quiet"?[]:siteIds(scope).flatMap(id=>invoices[id].map(entry=>[...entry,id]));
const sum=(values)=>values.reduce((total,value)=>total+value,0);
const recorded=(scope=state.scope)=>siteIds(scope).includes("main")?10600:0;
const outstanding=(scope=state.scope)=>sum(invoiceRows(scope).map(row=>row[1]))+(siteIds(scope).includes("main")?15000:0);
const oldest=(rows)=>Math.max(0,...rows.map(row=>row[2]));
const btn=(action,label,cls="quiet-link",glyph="arrow")=>`<button type="button" class="${cls}" data-action="${action}">${label}${icon(glyph,true)}</button>`;
const row=(action,glyph,title,detail)=>`<button type="button" class="row" data-action="${action}"><span class="row-icon">${icon(glyph)}</span><span class="row-copy"><strong>${title}</strong><span class="secondary">${detail}</span></span>${icon("right",true)}</button>`;
function render(changed=false){
 document.documentElement.dataset.sport=state.sport;
 $("#club").textContent=club().name;
 const selector=$("#scope");
 selector.innerHTML=`${icon("pin",true).replace('small-icon','small-icon pin')}<span>${siteName()}</span>${icon("down",true)}`;
 selector.setAttribute("aria-label",`Facility scope, ${siteName()}`);
 selector.disabled=state.opening;
 const rows=invoiceRows();
 const late=sum(rows.map(invoice=>invoice[1]));
 const count=rows.length;
 const cash=state.scenario==="cash"&&siteIds().includes("main");
 const hasSession=siteIds().includes("main");
 const cashCard=cash?`<section class="exception" aria-label="Cash count needs review">
   <div class="issue-face"><span class="issue-icon">${icon("alert")}</span><div><strong>Cash count is ₹850 short</strong><p>${siteName("main")} · 20 Nov</p></div></div>
   ${btn("cash","Review cash count","primary")}
 </section>`:"";
 const dues=count?`<div class="invoice-action${cash?" secondary-action":""}">
   <div class="issue-face"><span class="issue-icon">${icon("alert")}</span><div><strong>${money(late)} overdue</strong><p>${count} invoices · Oldest ${oldest(rows)} days late</p></div></div>
   ${btn("invoices","Review overdue invoices",cash?"quiet-link":"primary")}
 </div>`:`<p class="normal-note">${icon("check",true)} No overdue invoices</p>`;
 const split=state.scope==="all"?`<section class="block facilities" aria-label="Facility breakdown">
   <button type="button" class="row facilities-toggle" data-action="breakdown" aria-expanded="${state.bySite}" aria-controls="site-list"><span class="row-icon">${icon("site")}</span><span class="row-copy"><strong>By facility</strong><span class="secondary">2 facilities</span></span><span class="tail">${icon("down",true)}</span></button>
   <div id="site-list"${state.bySite?"":" hidden"}>${siteIds().map(id=>`<button type="button" class="row" data-action="switch" data-value="${id}"><span class="row-copy"><strong>${siteName(id)}</strong><span class="secondary">${money(recorded(id))} recorded · Last 7 days</span></span><span class="site-money">${money(outstanding(id))}<span>Outstanding</span></span>${icon("right",true)}</button>`).join("")}</div>
 </section>`:"";
 $("#content").innerHTML=`${cashCard}
   <section class="ledger" aria-labelledby="money-title">
     <div class="ledger-head"><h2 id="money-title">Money</h2>${btn("collections","View collections")}</div>
     <div class="received">
       <div><div class="metric-label">Recorded · Last 7 days</div><div class="major">${money(recorded())}</div></div>
       <div class="today"><span class="metric-label">Today</span><strong>₹0</strong></div>
     </div>
     <div class="balance"><h3 class="metric-label">Outstanding · Current balance</h3><strong>${money(outstanding())}</strong></div>${dues}
   </section>${split}
   <section class="block" aria-label="Club operations">
     <h2 class="area-title block-title">Club today</h2>
     ${hasSession?`<button class="row" type="button" data-action="session"><span class="session-time">17:00</span><span class="row-copy"><strong>${club().session}</strong><span class="secondary">${siteName("main")} · ${club().coach}</span></span>${icon("right",true)}</button>`:'<p class="muted-row">No more sessions today at this facility.</p>'}
     ${hasSession&&state.scenario!=="quiet"?row("followups","talk","2 overdue enquiry follow-ups",siteName("main")):""}
   </section>`;
 if(changed){
   const content=$("#content");
   content.classList.remove("changed");
   requestAnimationFrame(()=>content.classList.add("changed"));
 }
}
let sheetTrigger=null;
const sheet=$("#sheet");
function openSheet(title,html,trigger){
  $("#sheet-title").textContent=title;
  $("#sheet-body").innerHTML=html;
  if(!sheet.open){
    sheetTrigger=trigger;
    sheet.showModal();
    sheet.querySelector("[data-action=close]").focus();
  }
}
sheet.querySelector("[data-action=close]").innerHTML=icon("cross");
sheet.addEventListener("close",()=>{
 const target=sheetTrigger?.isConnected&&!sheetTrigger.disabled?sheetTrigger:$("#scope");
 target.focus({preventScroll:true});
 sheetTrigger=null;
});
const say=text=>{$("#announce").textContent=text;};
function profile(trigger){
 openSheet("Facility scope",["all","main","other"].map(id=>`<button type="button" class="picker-option" data-action="switch" data-value="${id}"${id===state.scope?' aria-current="true"':""}>${siteName(id)}${id===state.scope?icon("check",true):icon("right",true)}</button>`).join(""),trigger);
}
function networkMessage(content="",type=""){
 const el=$("#network");
 el.hidden=!content;
 el.dataset.type=type;
 el.innerHTML=content;
}
async function switchScope(id){
 if(!["all","main","other"].includes(id)||state.opening)return;
 if(sheet.open)sheet.close();
 if(id===state.scope){$("#scope").focus({preventScroll:true});return;}
 state.opening=true;
 $("#scope").disabled=true;
 const pendingMessage=`Loading ${siteName(id)}… Still showing ${siteName()}.`;
 networkMessage(pendingMessage,"pending");
 say(pendingMessage);
 await new Promise(resolve=>setTimeout(resolve,440));
 state.opening=false;
 $("#scope").disabled=false;
 if(state.failNext){
   state.failNext=false;
   state.failedScope=id;
   const message=`Couldn’t load ${siteName(id)}. Still showing ${siteName()}.`;
   networkMessage(`${message}<button class="quiet-link" data-action="retry">Retry</button>`,"error");
   say(message);
   $("#network").querySelector("button").focus({preventScroll:true});
   return;
 }
 state.scope=id;
 state.bySite=false;
 state.failedScope=null;
 networkMessage();
 render(true);
 say(`Showing ${siteName()}.`);
 $("#scope").focus({preventScroll:true});
}
const heading=(text)=>`<p class="sheet-copy">${text}</p>`;
const list=rows=>`<ul class="sheet-list">${rows.map(([title,detail,end])=>`<li><span><strong>${title}</strong>${detail?`<small>${detail}</small>`:""}</span><span>${end??""}</span></li>`).join("")}</ul>`;
const bucketValue=(i)=>i===5?recorded():0;
function chartMarkup(){
 const max=Math.max(1,recorded());
 return `${heading(`${siteName()} · 15–21 November`)}
 <div class="chart" role="group" aria-label="Recorded payments by day">${dates.map((date,i)=>`<button type="button" data-action="day" data-value="${i}" aria-pressed="${i===state.bucket}" aria-label="${date}, ${money(bucketValue(i))}"><span class="chart-plot" aria-hidden="true"><span class="chart-bar" style="height:${bucketValue(i)/max*94}%"></span></span><span aria-hidden="true">${date.split(" ")[0]}</span></button>`).join("")}</div>
 <p class="collection-selected" id="day-value" aria-live="polite"><span>${dates[state.bucket]}</span><strong>${money(bucketValue(state.bucket))}</strong></p>`;
}
function more(trigger){
 openSheet("More",`${row("invoices","alert","Overdue invoices","Fees")}
 <h3 class="demo-title">Preview scenarios</h3>
 <div class="choices" aria-label="Example conditions">${Object.entries(scenarioNames).map(([id,label])=>`<button type="button" class="choice" data-action="scenario" data-value="${id}" aria-pressed="${id===state.scenario}">${label}</button>`).join("")}</div>
 <h3 class="demo-title">Sport preset</h3>
 <div class="choices" aria-label="Example clubs">${Object.entries(clubs).map(([id,entry])=>`<button type="button" class="choice" data-action="preset" data-value="${id}" aria-pressed="${id===state.sport}">${entry.name}</button>`).join("")}</div>`,trigger);
}
function selectDemo(kind,value){
 if(kind==="scenario"&&Object.hasOwn(scenarioNames,value)){state.scenario=value;state.failNext=value==="offline";}
 if(kind==="preset"&&Object.hasOwn(clubs,value)){state.sport=value;state.scope="all";}
 state.bySite=false;
 state.failedScope=null;
 networkMessage();
 sheet.close();
 render(true);
 window.scrollTo({top:0,behavior:"instant"});
 say(kind==="scenario"?`Preview showing ${scenarioNames[state.scenario]}.`:`Preview showing ${club().name}.`);
}
const destinations={
 enquiries:["Enquiries","Enquiry capture and follow-up live in this section."],
 schedule:["Schedule","Find sessions by facility and day."],
 members:["Members","Open the member directory for the current facility scope."]
};
document.addEventListener("click",event=>{
 const target=event.target.closest("[data-action]");
 if(!target)return;
 const {action,value}=target.dataset;
 switch(action){
  case "today": window.scrollTo({top:0,behavior:"instant"});return;
  case "close": sheet.close();return;
  case "scope": profile(target);return;
  case "switch": switchScope(value);return;
  case "retry": switchScope(state.failedScope);return;
  case "breakdown":{
   const expanded=target.getAttribute("aria-expanded")==="true";
   state.bySite=!expanded;
   target.setAttribute("aria-expanded",String(!expanded));
   $("#site-list").hidden=expanded;
   if(!expanded)$("#site-list").classList.add("changed");
   return;
  }
  case "collections": openSheet("Collections",chartMarkup(),target);return;
  case "invoices":{
   const rows=invoiceRows();
   openSheet("Overdue invoices",heading(siteName())+(rows.length?list(rows.map(([number,paise,days,id])=>[number,`${siteName(id)} · ${days} ${days===1?"day":"days"} late`,money(paise)])):'<p>No overdue invoices.</p>'),target);
   return;
  }
  case "cash": openSheet("Cash count",heading(`${siteName("main")} · 20 Nov`)+list([["Recorded",null,"₹14,700"],["Counted",null,"₹13,850"],["Difference",null,"₹850 short"]]),target);return;
  case "session": openSheet(club().session,heading(`Today at 17:00 · ${siteName("main")}`)+list([["Coach",null,club().coach]]),target);return;
  case "followups": openSheet("Enquiry follow-ups",heading(siteName("main"))+list([["Trial follow-up","2 days overdue"],["Membership follow-up","1 day overdue"]]),target);return;
  case "more": more(target);return;
  case "preset": case "scenario": selectDemo(action,value);return;
  case "day":
    state.bucket=Number(value);
    sheet.querySelectorAll("[data-action=day]").forEach(day=>day.setAttribute("aria-pressed",String(day===target)));
    $("#day-value").innerHTML=`<span>${dates[state.bucket]}</span><strong>${money(bucketValue(state.bucket))}</strong>`;
    return;
  default:{const entry=destinations[action];if(entry)openSheet(entry[0],heading(entry[1]),target);}
 }
});
let touchStart=null;
const handle=$("#sheet-head");
handle.addEventListener("touchstart",event=>{if(event.target.closest("button"))return;touchStart=event.touches[0]?.clientY??null;},{passive:true});
handle.addEventListener("touchend",event=>{
 if(touchStart!==null&&event.changedTouches[0]?.clientY-touchStart>62&&sheet.scrollTop<=0)sheet.close();
 touchStart=null;
},{passive:true});
handle.addEventListener("touchcancel",()=>{touchStart=null;},{passive:true});
$("#mark").innerHTML=icon("mark");
$("#dock").innerHTML=[["today","home","Today"],["enquiries","talk","Enquiries"],["schedule","schedule","Schedule"],["members","people","Members"],["more","dots","More"]].map(([id,glyph,label])=>`<button type="button" data-action="${id}"${id==="today"?' aria-current="page"':' aria-haspopup="dialog"'}>${icon(glyph)}${label}</button>`).join("");
render();
</script>
</body>
</html>
