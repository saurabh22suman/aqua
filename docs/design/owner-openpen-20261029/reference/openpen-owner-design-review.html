<script>
(()=>{
const root=document.getElementById('khelsuite-owner-review');
const purposes={
 'Collected this week':'Money and the collection action stay together so the owner can move from evidence to action.',
 'Needs your decision':'A short exception queue states what needs attention and where to resolve it.',
 'Today’s sessions':'Time, coach, capacity and register completion answer the owner’s daily oversight questions.',
 'Batch capacity':'Capacity is kept separate from attendance so available places are not mistaken for marked presence.',
 'Collections · this week':'Trend detail follows the operational work instead of pushing urgent decisions down.',
 'Payment mix · same week':'A donut shows cash versus digital share; direct amounts and percentages preserve precision. Its centre total reconciles with the collection trend for the same week.',
 'Member directory':'Aligned identity and status support scanning; amounts and contact details remain readable on phone.',
 'Personal details':'Persistent labels and grouped short fields make correction and recovery easier.',
 'Guardian':'Guardian identity is a separate responsibility from the member’s own contact details.',
 'Consent':'Required processing consent stays separate from optional communications consent and above submission.',
 'Participation & enrolment':'Academy participation, batch enrolment and the paid plan must never be mistaken for one another.',
 'Contacts & consent':'Stable personal context sits beside daily operations rather than repeating the member header.',
 'Invoice breakdown':'The invoice total, payments already recorded and amount still due remain visible before collection.',
 'Record payment':'The amount and method sit in the selected invoice’s context, reducing wrong-record mistakes.',
 'Corrections':'Reversal and voiding stay distinct and secondary, with reasons and confirmation.',
 'Current enquiries':'Owner oversight leads; routine capture remains a secondary front-desk workflow.',
 'Follow-up timeline':'The history and next due follow-up explain why the selected action is appropriate.',
 'Next action':'Only one trial or conversion workflow is open at a time.',
 'Compose an announcement':'Audience selection stays beside the message so sending scope is explicit.',
 'Sent history':'Created and queued states are evidence, without inventing delivery or read status.',
 'Your notifications':'Personal notifications are kept separate from academy-wide communication history.',
 'Effective rules':'Human-readable values, scope and change authority stay on the same row.',
 'Your account':'Personal appearance and sign-out remain separate from operational academy settings.'
};
const pages=[];
const button=(label,to,primary=false)=>`<button type="button" class="ks-button ${primary?'ks-primary':''}" ${to?`data-open="${to}"`:'data-demo="true"'}>${label}</button>`;
const link=(label,to)=>`<button type="button" class="ks-link" ${to?`data-open="${to}"`:'data-demo="true"'}>${label}</button>`;
const badge=(label,tone='')=>`<span class="ks-status ${tone}">${label}</span>`;
const row=(title,detail,right='')=>`<div class="ks-line"><div><strong>${title}</strong><small>${detail}</small></div>${right}</div>`;
const surface=(title,body,cls='')=>`<section class="ks-surface ${cls}"><h2>${title}</h2>${body}</section>`;
const grid=(a,b,equal=false)=>`<div class="ks-grid ${equal?'ks-equal':''}">${a}${b}</div>`;
const table=(heads,rows)=>`<table><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td data-label="${heads[i]}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
let fieldId=0;

const pageSelect=root.querySelector('#ks-page'),themeSelect=root.querySelector('#ks-theme'),sizeSelect=root.querySelector('#ks-size'),stateSelect=root.querySelector('#ks-state');
const groups=[...new Set(pages.map(p=>p.group))];
pageSelect.innerHTML=groups.map(g=>`<optgroup label="${g}">${pages.filter(p=>p.group===g).map(p=>`<option value="${p.id}">${p.title}</option>`).join('')}</optgroup>`).join('');
let selected='home';
const navGroups=[['Main',[['home','Home','house'],['members','Members','users']]],['Operations',[['fees','Fees & payments','receipt'],['enquiries','Enquiries','clipboard-list'],['announcements','Announcements','megaphone'],['staff','Staff','briefcase']]],['Scheduling',[['programs','Programs & batches','calendar-days'],['sessions','Sessions','list-checks'],['schedule','Schedule','calendar-range'],['bookings','Bookings','calendar-days']]],['Account',[['reports','Reports','chart-no-axes-combined'],['settings','Settings','settings']]]];
function render(){
 const p=pages.find(p=>p.id===selected)||pages[0];selected=p.id;pageSelect.value=p.id;
 const activeNav=({Home:'home',Members:'members','Fees & payments':'fees',Reports:'reports',Enquiries:'enquiries',Communications:'announcements','Team & access':'staff',Settings:'settings',Setup:'home'})[p.group] || (p.id==='batch'?'programs':p.id);
 const product=root.querySelector('.ks-product');product.dataset.theme=themeSelect.value;product.classList.toggle('ks-phone',sizeSelect.value==='phone');
 root.querySelector('#ks-crumb').textContent='Workspace / '+p.group;
 root.querySelector('#ks-nav').innerHTML=navGroups.map(([label,items])=>`<div class="ks-navlabel">${label}</div>${items.map(([id,t,icon])=>{const dest=pages.find(x=>x.id===id);return `<button type="button" class="ks-navbutton" data-open="${id}" ${id===activeNav?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${t}</button>`;}).join('')}`).join('');
 const heading=`<div class="ks-heading"><div><h1>${p.title}</h1><p class="ks-sub">${p.subtitle}</p></div>${p.action?button(p.action[0],p.action[1],true):''}</div>`;
 let body=p.body();
 if(stateSelect.value==='empty')body=`<div class="ks-empty"><h2>No records in this view</h2><p class="ks-sub">Keep the page context visible, explain the missing prerequisite, and offer the permitted next step.</p>${button('Return to populated study',null)}</div>`;
 if(stateSelect.value==='loading')body=`<div class="ks-empty" role="status"><h2>Loading ${p.title.toLowerCase()}…</h2><p class="ks-sub">Keep the selected location, filters and page heading visible.</p><div class="ks-progress"><span style="width:40%"></span></div></div>`;
 if(stateSelect.value==='error')body=`<div class="ks-empty" role="alert"><h2>Could not load this view</h2><p class="ks-sub">Show the failed section and a retry. Do not turn an unreadable balance into zero.</p>${button('Retry preview',null,true)}</div>`;
 root.querySelector('#ks-main').innerHTML=heading+body;
 root.querySelector('.ks-bottom').innerHTML=[['home','Home'],['members','Members'],['reports','Reports'],['settings','Settings']].map(([id,t])=>`<button type="button" data-open="${id}" ${pages.find(x=>x.id===id).group===p.group?'aria-current="page"':''}>${t}</button>`).join('');
 root.querySelector('#ks-note').textContent=p.notes+' · '+p.route;
 const sectionTitles=[...root.querySelectorAll('#ks-main h2')].map(h=>h.textContent);
 root.querySelector('#ks-rationale').innerHTML=sectionTitles.length?sectionTitles.map(title=>`<li><strong>${title}:</strong> ${purposes[title]||p.notes}</li>`).join(''):`<li>${p.notes}</li>`;
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
let saveTimer;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{ownerPage:selected,theme:themeSelect.value,layout:sizeSelect.value,state:stateSelect.value},privateContent:null}).catch(()=>{});},250);}
function restore(s){if(!s||typeof s!=='object')return;const v=s.modelContent||s;if(pages.some(p=>p.id===v.ownerPage))selected=v.ownerPage;if(['mint','lavender'].includes(v.theme))themeSelect.value=v.theme;if(['phone','desktop'].includes(v.layout))sizeSelect.value=v.layout;if(['populated','empty','loading','error'].includes(v.state))stateSelect.value=v.state;}
pageSelect.addEventListener('change',()=>{selected=pageSelect.value;stateSelect.value='populated';render();save();});
[themeSelect,sizeSelect,stateSelect].forEach(el=>el.addEventListener('change',()=>{render();save();}));
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.open){selected=b.dataset.open;stateSelect.value='populated';render();save();}else if(b.dataset.demo){if(stateSelect.value!=='populated'){stateSelect.value='populated';render();}else root.querySelector('#ks-note').textContent='Preview interaction only — no data was saved, sent or changed.';}});
root.addEventListener('submit',event=>event.preventDefault());
root.querySelector('.ks-search input').addEventListener('input',()=>{root.querySelector('#ks-note').textContent='Record-search placement study. This mock is not connected to live records.';});
window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);render();});
restore(window.openai?.widgetState);render();
if(globalThis.Tweak){
 const layout={gutter:28,gap:20};
 const product=root.querySelector('.ks-product');
 const applyLayout=()=>{product.style.setProperty('--ks-gutter',layout.gutter+'px');product.style.setProperty('--ks-gap',layout.gap+'px');};
 const tweak=new Tweak({container:product,onChange:applyLayout});
 tweak.addSlider(layout,'gutter',{label:'Content gutter',min:16,max:32,step:4,unit:'px'});
 tweak.addSlider(layout,'gap',{label:'Section gap',min:12,max:28,step:4,unit:'px'});
}
})();
