:root{
  --base:#f5f6fa;--paper:#fff;--ink:#161936;--muted:#525976;--line:#dfe3ef;
  --accent:#2d43d2;--active:#e8edff;--deep:#202c85;--deep-end:#273ca6;--light:#edf0ff;
  --lime:#f0f49c;--success:#166247;--success-bg:#e7f5ec;--warn:#813c0e;--warn-bg:#fff1df;
  --radius:18px;--small:11px;--display:Barlow,'Arial Narrow',sans-serif;--body:DM,system-ui,sans-serif;
}
:root[data-theme="pool"]{
  --base:#f1f7f6;--ink:#14312f;--muted:#415e5a;--line:#d9e8e4;--accent:#096953;--active:#def3ea;
  --deep:#13463f;--deep-end:#23655b;--light:#dfefe9;--lime:#ecf5b0;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.45 var(--body);color:var(--ink);background:var(--base);-webkit-font-smoothing:antialiased}
body:has(dialog[open]){overflow:hidden}
a,button,select,input{font:inherit}
button,a,select{touch-action:manipulation}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default}
button{border:0}
a{color:var(--accent)}
h1,h2,h3,p{margin:0}
h1,h2,.display{font-family:var(--display);font-weight:700}
h1{font-size:clamp(48px,5vw,70px);line-height:.93;letter-spacing:-.026em}
h2{font-size:31px;line-height:1.04;letter-spacing:-.013em}
h3{font-size:16px;line-height:1.25}
small{font-size:12px}
select,input{color:var(--ink);min-width:0}
svg{flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ledger :focus-visible{outline-color:var(--lime)}
[hidden]{display:none!important}
.sr-only,.skip:not(:focus){position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip:focus{position:fixed;top:6px;left:8px;z-index:15;padding:12px;background:#fff}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 26px;background:var(--paper);border-bottom:1px solid var(--line);gap:15px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:850;letter-spacing:-.07em;white-space:nowrap}
.brand i{display:grid;place-items:center;width:33px;height:33px;background:var(--accent);border-radius:9px;color:white}
.brand i svg{width:22px;height:22px}
.brand b{color:var(--accent)}
.preview-controls{display:flex;gap:9px;align-items:center}
.preview-label{letter-spacing:.10em;font-size:10px;font-weight:850;color:var(--muted);margin-right:5px}
.select-wrap{display:inline-flex;align-items:center;gap:6px;position:relative;background:var(--paper);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-height:40px;padding-left:9px;max-width:100%}
.select-wrap select{background:none;border:0;padding:0 12px 0 2px;font-size:12px;font-weight:750;min-height:38px;border-radius:9px;cursor:pointer}
.frame{display:grid;grid-template-columns:213px minmax(0,1fr);min-height:calc(100dvh - 66px)}
.rail{border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:27px;padding:24px 14px 18px}
.club{display:flex;align-items:center;gap:10px;background:var(--base);padding:12px 10px;border-radius:var(--small);min-height:61px}
.club-name{display:block;line-height:1.13;font-weight:850;letter-spacing:-.02em}
.club small{display:block;margin-top:4px;color:var(--muted);font-size:11px}
.rail nav{display:grid;gap:4px}
.rail-label{color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.12em;margin:0 0 6px 10px}
.navitem{display:flex;align-items:center;gap:10px;min-height:45px;border-radius:9px;padding:8px 11px;text-decoration:none;color:var(--muted);font-weight:750}
.navitem:hover{background:var(--base);color:var(--ink)}
.navitem[aria-current="page"]{background:var(--active);color:var(--accent)}
.rail-foot{padding:12px 10px 0;border-top:1px solid var(--line);margin-top:auto;color:var(--muted);font-size:11px}
.mobile-nav{display:none}
main{width:min(100%,1460px);margin:0 auto;padding:28px clamp(24px,3.4vw,52px) 38px;outline:0}
.view{animation:enter .24s ease-out both}
@keyframes enter{from{opacity:.63;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 25px;min-height:106px}
.context{display:flex;flex-wrap:wrap;gap:7px;align-items:center;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:12px}
.context .sep{opacity:.56}
.subtitle{color:var(--muted);margin-top:10px;font-size:14px}
.head-tools{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}
.scope.select-wrap{min-height:43px}
.scope.select-wrap select{min-height:41px;font-size:13px;padding-right:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 13px;border-radius:9px;font-weight:800;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px}
.btn:hover{background:var(--active)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.91)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.quiet:hover{background:var(--active)}
.btn:disabled{color:var(--muted);background:var(--base);border-color:var(--line);opacity:.75}
.icon{width:17px;height:17px;display:inline-block;vertical-align:middle}
.iconbox{display:grid;place-items:center;color:var(--accent);background:var(--active);width:36px;height:36px;border-radius:10px;flex:none}
.iconbox.good{background:var(--success-bg);color:var(--success)}
.iconbox.warn{background:var(--warn-bg);color:var(--warn)}
.kicker{display:flex;gap:7px;align-items:center;font-size:11px;font-weight:850;letter-spacing:.105em;text-transform:uppercase;line-height:1.25}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--active);color:var(--accent);font-size:11px;font-weight:800;padding:4px 7px;border-radius:6px;line-height:1.22}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--success-bg);color:var(--success)}
.tag.dim{background:var(--base);color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:17px;align-items:start}
.stack{display:grid;gap:17px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.panel-top{padding:17px 19px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:66px}
.panel-top p{margin-top:4px;color:var(--muted);font-size:12px}
.panel-body{padding:18px 19px}
.ledger{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(121deg,var(--deep),var(--deep-end));color:#fff;border-radius:var(--radius);padding:19px 23px 15px;min-height:209px;display:flex;flex-direction:column;justify-content:space-between}
.ledger::before{position:absolute;content:"";inset:0;z-index:-1;opacity:.34;pointer-events:none;background:linear-gradient(90deg,transparent 0%,var(--deep) 77%),repeating-linear-gradient(0deg,transparent 0 25px,#b3c1ff35 25px 26px),repeating-linear-gradient(90deg,transparent 0 25px,#b3c1ff35 25px 26px)}
.ledger-head{display:flex;align-items:center;justify-content:space-between;color:#fff;gap:12px}
.ledger-head .kicker{color:var(--lime)}
.ledger-head .asof{color:var(--light);font-size:11px;text-align:right}
.ledger-data{display:grid;grid-template-columns:1.06fr 1fr;margin-top:13px}
.metric{min-width:0;padding:0 12px 4px 0}
.metric + .metric{padding:0 0 4px 17px;border-left:1px solid #d4ddfa55}
.metric-label{color:var(--light);font-weight:650;font-size:13px;line-height:1.2}
.metric-val{font:700 clamp(27px,3.7vw,57px)/1.05 var(--display);letter-spacing:-.02em;font-feature-settings:"tnum";margin:4px 0 3px;white-space:nowrap}
.rupee{font-family:var(--body);font-size:.68em;font-weight:650;margin-right:.08em;vertical-align:.06em}
.metric a{display:inline-flex;align-items:center;gap:5px;min-height:34px;font-size:11px;font-weight:750;color:var(--light);text-underline-offset:3px}
.metric a svg{width:13px;height:13px}

function announce(message, toast = false) {
  clearTimeout(liveTimer);
  $('#live').textContent = message;
  if (toast) {
    $('#notice').hidden = false;
    $('#notice').textContent = message;
    liveTimer = setTimeout(() => { $('#notice').hidden = true; }, 4200);
  } else $('#notice').hidden = true;
}
function navItems() {
  const active = state.page === 'payments' || state.page === 'outstanding' || state.page === 'overdue' || state.page === 'collections' ? 'fees' : state.page;
  return roleNav().map(([route, label, glyph]) => `<a class="navitem" href="#${state.role}/${route}"${active === route ? ' aria-current="page"' : ''}>${icon(glyph)}<span>${label}</span></a>`).join('');

function needsAttention() {
  const needsCover = (state.role === 'manager' || state.urgent) && !fixture().cover && inScope('north');
  const cashSite = ['west','north','south'].find(inScope);
  const late = outstanding().filter(inv => inv.late);
  let title, body, action, glyph, tone;
  if (needsCover) {
    title = 'Arrange coach cover';
    body = `${club().sessions[0]} at 17:30 · ${siteName('north')}. The assigned coach is unavailable.`;
    action = button('Assign cover','cover',{kind:'primary',glyph:'right'});
    glyph = 'clock'; tone = 'warn';
  } else if (state.role === 'owner' && cashSite && !fixture().cash?.includes(cashSite)) {
    title = 'Review the cash count';
    body = `${siteName(cashSite)} closed yesterday ${money(amount(cashSite === 'west' ? 850 : 600))} short. Compare the count with recorded cash payments.`;
    action = button('Open cash count','cash',{kind:'primary',glyph:'right',value:cashSite});
    glyph = 'alert'; tone = 'warn';
  } else if (state.role === 'owner' && late.length) {
    title = 'Review overdue fees';
    body = `${late.length} open invoices are past their due dates.`;
    action = link('Review overdue','overdue',{kind:'primary'});
    glyph = 'wallet'; tone = '';
  } else {
    title = 'Check today’s schedule';
    body = 'Review upcoming sessions and their assigned coaches.';
    action = link('Open schedule','schedule',{kind:'primary'});
    glyph = 'calendar'; tone = '';
  }
  return `<section class="priority" aria-label="Needs attention"><div><div class="priority-label">${iconBox(glyph,tone)}<p class="kicker" style="color:inherit">Needs attention</p></div><h2>${title}</h2><p>${body}</p></div>${action}</section>`;
}
function agendaRows(entries) {

const chartDays = ['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
function chartValues() {
  return [0,1,2,3,4,5].map(day => Object.keys(previousCollections).filter(inScope).reduce((sum, site) => sum + amount(previousCollections[site][day]),0)).concat(currentCol());

function collectionChart() {

  return panel('Collections trend',`<div class="panel-body"><div class="chart-readout"><span>${chartDays[state.chart]} · ${14+state.chart} Nov</span><output>${money(values[state.chart])}</output></div>
  <div class="chart" role="group" aria-label="Collections by day">${bars}</div><div class="chart-footer"><span>14–20 November</span>${link('Open collections','collections',{kind:'quiet'})}</div></div>`,{cls:'chart-card',note:'Gross recorded payments by day'});
}

function finance() {
  const tab = state.page;
  const title = {fees:'Fees and payments',payments:'Payments recorded',outstanding:'Outstanding invoices',overdue:'Overdue invoices',collections:'Collections'}[tab];
  const tabs = [['fees','Summary'],['payments','Today’s payments'],['outstanding','Outstanding'],['overdue','Overdue']];
  const tabLinks = `<div class="action-group" style="margin-bottom:14px" aria-label="Fees views">${tabs.map(([p,text])=>`<a class="btn ${p===tab?'primary':''}" href="#owner/${p}" ${p===tab?'aria-current="page"':''}>${text}</a>`).join('')}</div>`;
  const visible = outstanding().filter(inv => tab!=='overdue' || inv.late);
  const isPayment = tab === 'payments';
  const records = isPayment ? visiblePayments().map(pay=>row(people[pay.person].name,`${pay.id} · ${siteName(pay.site)} · ${pay.method}`,`<span class="amount">${money(amount(pay.amount))}</span>`,iconBox('wallet'))) :
    visible.map(inv=>row(people[inv.person].name,`${inv.id} · ${siteName(people[inv.person].site)} · Due ${inv.due}`,`${inv.late?tag('Overdue','warn'):tag('Open','dim')} <span class="amount">${money(amount(inv.amount))}</span>`,iconBox('file')));
  const period = isPayment ? 'Friday, 20 November 2026' : tab==='collections' ? '14–20 November 2026' : 'Current balances · 20 November 2026';
  const coverage = `${scopeLabel()} · ${period}`;
  const scopeRows = Object.keys(club().sites).filter(inScope).map(site => row(siteName(site),'Payments recorded today',`<span class="amount">${money(visiblePayments().filter(pay=>pay.site===site).reduce((sum,pay)=>sum+amount(pay.amount),0))}</span>`,iconBox('building')));
  if (tab==='fees') return heading(title,coverage,scopePicker()) + tabLinks + `<div class="layout">${ledger()}${panel('By facility',list(scopeRows,'No facilities in this view.'))}</div>`;
  if (tab==='collections') return heading(title,coverage,scopePicker()) + tabLinks + `<div class="layout">${collectionChart()}${panel('By facility',list(scopeRows,'No facilities in this view.'),{note:'Today’s payments reconcile to the selected total'})}</div>`;
  return heading(title,coverage,scopePicker()) + tabLinks + panel(`${money(isPayment ? currentCol() : dueTotal(visible))} across ${records.length} ${isPayment?'payments':'invoices'}`,list(records,'No records in this view.'));
}

  </div>`;

function updateGuardianHits(value) {
  const q = value.trim().toLowerCase();
  const token = ++state.queryToken;
  state.guardian = '';
  $('#guardian-next').innerHTML = '';
  if (q.length < 2) {
    $('#guardian-results').innerHTML = '<p class="muted">Enter at least two letters to search.</p>';
    announce('Guardian selection cleared.');
    return;
  }
  $('#guardian-results').innerHTML = '<p class="muted">Searching for guardians…</p>';
  announce('Searching for guardians.');
  setTimeout(() => {
    if (state.queryToken!==token || !$('#guardian-results')) return;
    const hits = guardians.filter(g => g.name.toLowerCase().includes(q));
    $('#guardian-results').innerHTML = hits.length ? hits.map(g => `<button class="search-hit" type="button" data-action="guardian" data-value="${g.id}" aria-pressed="false"><span><strong>${g.name}</strong><small>${g.detail}</small></span>${icon('chevron')}</button>`).join('') : '<p class="muted">No guardians match. Check the spelling and try again.</p>';
    announce(hits.length ? `${hits.length} guardian ${hits.length===1?'match':'matches'}.` : 'No guardian matches.');
  }, q.length === 2 ? 750 : 270);
}
function desk() {
  const person = people[state.member];
  const invoice = invoices.find(i => i.person === state.member);
  const isPaid = invoice && fixture().paid.includes(invoice.id);
  const uncertain = invoice && fixture().uncertain?.includes(invoice.id);
  let body;
  if (state.lookup === 'failed') body = alertBox('Invoice lookup failed',`Keep ${person.name} selected and retry the lookup for this member.`,'warn',button('Retry invoice lookup','retry',{kind:'primary',glyph:'right'}));
  else if (state.lookup === 'loading') body = alertBox('Looking up invoices',`Checking open balances for ${person.name}.`);
  else if (uncertain) body = alertBox('Payment status unknown',`Check the status of ${invoice.id} before attempting to record a payment again.`,'warn',button('Check payment status','status',{kind:'primary',glyph:'right'}));
  else if (isPaid) body = alertBox('Payment recorded',`${money(amount(invoice.amount))} · ${paidPayment(invoice).id}`,'good',button('View receipt','receipt',{value:paidPayment(invoice).id,glyph:'file'}));
  else if (invoice) body = `<div class="well">${details([['Invoice',invoice.id],['Due date',invoice.due],['Balance',money(amount(invoice.amount))],['Payment eligibility','Can record payment']])}</div>
    ${button('Record UPI payment','pay-review',{kind:'primary',glyph:'wallet'})}
    <label class="alert" style="align-items:center;margin-top:12px"><input id="payment-connection" type="checkbox" ${state.drop?'checked':''}> <span>Simulate connection loss after submission</span></label>`;
  else body = '<p class="muted">No open invoices for this member.</p>';
  return heading('Front desk','Invoice lookup and payment recovery') + `<div class="layout">
    ${panel('Invoice lookup',`<div class="panel-body" id="lookup-summary" tabindex="-1">${identity(person,siteName(person.site))}${body}</div>`,{note:'Selected member'})}
    ${panel('Find a member',`<div class="panel-body"><label class="field" for="member-query">Member name<input id="member-query" autocomplete="off" type="search" value="${escaped(state.memberQuery)}" placeholder="Search by name" aria-controls="member-results"></label><div id="member-results">${memberHits(state.memberQuery)}</div></div>`)}
  </div>`;
}
function memberHits(query) {
  const results = Object.entries(people).filter(([,p])=>p.name.toLowerCase().includes(query.trim().toLowerCase()));
  return results.length ? results.slice(0,query.trim()?7:4).map(([key, person]) => `<button class="search-hit" type="button" data-action="member" data-value="${key}" aria-pressed="${state.member===key}"><span><strong>${person.name}</strong><small>${siteName(person.site)}</small></span>${icon(state.member===key?'check':'chevron')}</button>`).join('') : '<p class="muted">No members match that name.</p>';
}

function markFor(entry) {
  return fixture().marks[entry.person] || {status:entry.default || '',synced:!!entry.default};
}
function register() {
  const f = fixture(), statuses = roster.map(markFor), marked = statuses.filter(m => m.status).length;
  const pending = statuses.filter(m => m.status && !m.synced).length;
  const title = f.offline ? 'You’re offline' : pending ? 'Syncing attendance' : 'You’re online';
  const info = f.offline
    ? `${pending?`${pending} ${pending===1?'mark':'marks'} saved on this device.`:'You can still mark attendance.'} Changes sync when you reconnect.`
    : pending ? `${pending} ${pending===1?'mark is':'marks are'} saved on this device and waiting to sync.`
    : 'Saved marks have synced.';
  const rows = roster.map(entry => {
    const person = people[entry.person], mark = markFor(entry);
    const result = mark.status ? mark.synced ? 'Synced' : 'Saved on this device' : 'Unmarked';
    return `<li class="row roster-row"><div class="avatar" aria-hidden="true">${person.initials}</div><div class="desc"><strong>${person.name}</strong><small class="result-state" id="mark-${entry.person}">${result}</small></div>

  });
  const simulation = button(f.offline?'Simulate reconnect':'Simulate offline','connection',{glyph:'wifi'});
  return heading('Attendance register',`Today, 17:30 · ${siteName('north')}`,simulation) + `<div class="layout">
    <div class="stack">${panel(club().sessions[0],`<div class="register-message">${alertBox(title,info,f.offline?'warn':pending?'':'good')}</div>${list(rows,'')}`,{tools:tag(`${marked} of ${roster.length} marked`),note:`${club().resource} 2 · Coach Arjun Mehta`})}</div>

  </div>`;
}

const pages = {
  owner:{today:ownerHome,fees:finance,payments:finance,outstanding:finance,overdue:finance,collections:finance,schedule,enquiries,updates},
  manager:{today:managerHome,schedule,updates},
  reception:{desk,bookings},
  coach:{register,schedule},
  family:{home:familyHome,billing,updates}
};
function render({focus='',scroll=false} = {}) {
  const active = document.activeElement;
  const id = active?.id;
  const action = active?.dataset?.action;
  const value = active?.dataset?.value;
  shell();
  $('#main').innerHTML = `<div class="view">${pages[state.role][state.page]()}</div>`;
  if (scroll) window.scrollTo(0,0);
  if (focus) $(focus)?.focus({preventScroll:true});
  else if (id) document.getElementById(id)?.focus({preventScroll:true}); else if (action) {
    [...document.querySelectorAll('[data-action]')].find(el=>el.dataset.action===action&&el.dataset.value===value&&!el.disabled)?.focus({preventScroll:true});
  }
}
function validPage(role, path) {
  return Object.hasOwn(pages[role],path) && (path!=='bookings' || club().bookings);
}
function readRoute(initial = false) {
  if (location.hash === '#main' && !initial) return;
  const [role, path] = location.hash.slice(1).split('/');
  const nextRole = Object.hasOwn(roles,role) ? role : 'owner';
  const nextPage = validPage(nextRole,path) ? path : roles[nextRole].start;
  if (state.role !== nextRole) {
    state.scope = 'all'; state.day = 0; state.direction = ''; state.chart = 6;
  }
  state.queryToken += 1;
  state.guardian = '';
  state.role = nextRole;
  state.page = nextPage;
  render({focus:initial?'':'#page-title',scroll:!initial});
  scheduleSync();
}
function navigate(role,page) {
  const next = `#${role}/${page}`;
  if (location.hash === next) readRoute();
  else location.hash = next;
}
function dialog(title, body) {
  const el = $('#dialog');
  if (!el.open) dialogReturn = document.activeElement;
  el.innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${title}</h2>${button('','close',{glyph:'x',extra:'aria-label="Close dialog"'})}</div><div class="dialog-body">${body}</div>`;
  if (!el.open) el.showModal();
}
const dialogActions = content => `<div class="action-group">${content}</div>`;
function closeDialog() {
  if ($('#dialog').open) $('#dialog').close();
}
$('#dialog').addEventListener('close', () => {
  if (dialogReturn?.isConnected) dialogReturn.focus({preventScroll:true});
  dialogReturn = null;
});
function receipt(id) {
  const p = [...payments(),legacy].find(pay => pay.id === id);
  if (!p) return;
  if (state.role === 'family' && p.person !== state.child) return;
  const person = people[p.person];
  dialog(p.legacy?'Older payment receipt':'Payment receipt', `${identity(person,siteName(person.site))}
    ${details([['Club',club().name],['Reference',p.id],['Payment for',p.part],['Date recorded',p.date],['Amount',money(amount(p.amount))],['Method',p.method]])}
    ${dialogActions(button('Print receipt','print',{kind:'primary',glyph:'file'}))}`);
}
function guardianSelect(key) {
  state.guardian = key;
  const person = guardians.find(g=>g.id===key);
  document.querySelectorAll('[data-action="guardian"]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.value===key)));
  $('#guardian-next').innerHTML = `<div class="alert good"><div><strong>${person.name} selected</strong><p>Review this link before converting Tara’s enquiry.</p>${button('Review conversion','guardian-review',{kind:'primary',glyph:'right'})}</div></div>`;
  announce(`${person.name} selected for review.`);
}
function lookup() {
  clearTimeout(lookupTimer);
  state.lookup = 'loading';
  const member = state.member;
  render({focus:'#lookup-summary'});
  $('#lookup-summary').scrollIntoView({block:'nearest'});
  announce(`Looking up invoices for ${people[member].name}.`);
  lookupTimer = setTimeout(() => {
    if (state.member!==member) return;
    state.lookup = 'ready';
    if (state.role==='reception' && state.page==='desk') {
      render();
      announce(`Invoice lookup complete for ${people[member].name}.`);
    }
  },510);
}
function recordPayment() {
  const invoice = invoices.find(i=>i.person===state.member);
  if (!invoice) return;
  if (!fixture().paid.includes(invoice.id)) fixture().paid.push(invoice.id);
  const uncertain = state.drop;
  if (uncertain) {
    fixture().uncertain ||= [];
    if (!fixture().uncertain.includes(invoice.id)) fixture().uncertain.push(invoice.id);
  }
  state.drop = false;
  persist();
  closeDialog();
  render({focus:uncertain ? '[data-action="status"]' : '[data-action="receipt"]'});
  announce(uncertain ? 'Connection interrupted. Check payment status before trying again.' : 'Payment recorded.',!uncertain);
}
function mark(value) {
  const [key,status] = value.split('|');
  const f=fixture();
  f.marks[key] = {status,synced:false};
  persist();
  render();
  announce(`${people[key].name} marked ${status.toLowerCase()}. Saved on this device.`);
  scheduleSync();
}
function scheduleSync() {
  clearTimeout(syncTimer);
  const f = fixture(), pending = Object.values(f.marks).filter(mark=>!mark.synced);
  if (f.offline || !pending.length) return;
  syncTimer = setTimeout(() => {
    if (f.offline) return;
    pending.forEach(mark=>{mark.synced=true;});
    persist();
    if (state.role==='coach' && state.page==='register') {
      render();
      announce(`${pending.length} attendance ${pending.length===1?'mark':'marks'} synced.`,true);
    }
  },650);
}
function changeDay(offset) {
  const next = state.day + offset;
  if (next<0 || next>=dates.length) return;
  state.day = next;
  state.direction = offset > 0 ? 'slide-right' : 'slide-left';
  const focusedDayButton = document.activeElement?.dataset.action === 'day';
  const newButton = next===0 ? '1' : next===dates.length-1 ? '-1' : String(offset);
  render({focus:focusedDayButton ? `[data-action="day"][data-value="${newButton}"]` : ''});
  announce(`Schedule for ${dates[next].name}.`);
}
const actions = {
  bar(value) {
    state.chart = Number(value);
    const values = chartValues();
    document.querySelectorAll('[data-action="bar"]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.value)===state.chart)));
    $('.chart-readout span').textContent = `${chartDays[state.chart]} · ${14+state.chart} Nov`;
    $('.chart-readout output').value = money(values[state.chart]);
  },
  day(value) { changeDay(Number(value)); },
  close() { closeDialog(); },
  print() { window.print(); },
  cash(site) {
    dialog('Cash count',details([['Facility',siteName(site)],['Count date','19 November 2026'],['Cash variance',`${money(amount(site==='west'?850:600))} short`]])+dialogActions(button('Mark reviewed','cash-done',{kind:'primary',glyph:'check',value:site})));
  },
  'cash-done'(site) {
    fixture().cash ||= [];
    if (!fixture().cash.includes(site)) fixture().cash.push(site);
    persist(); closeDialog(); render({focus:'.priority .btn'}); announce('Cash count marked reviewed.',true);
  },
  cover() {
    dialog('Assign coach cover',details([['Session',club().sessions[0]],['Facility',siteName('north')],['Time','17:30'],['Available coach','Kavya Rao']])+dialogActions(button('Assign Kavya Rao','cover-done',{kind:'primary',glyph:'check'})));
  },
  'cover-done'() {
    fixture().cover=true; persist(); closeDialog(); render({focus:'.priority .btn'}); announce('Kavya Rao assigned. Schedule updated.',true);
  },
  guardian(guardian) { guardianSelect(guardian); },
  'guardian-review'() {
    const guardian=guardians.find(g=>g.id===state.guardian);
    if (!guardian) return;
    dialog('Confirm enquiry conversion',details([['New member','Tara Nair'],['Linked guardian',guardian.name],['Programme',club().sessions[0]],['Facility',siteName('north')]])+dialogActions(button('Convert enquiry','guardian-done',{kind:'primary',glyph:'check'})));
  },
  'guardian-done'() {
    fixture().guardian=state.guardian; persist(); closeDialog(); render({focus:'#page-title'}); announce('Enquiry converted. Guardian linked.',true);
  },
  member(key) {
    state.member=key; state.drop=false;
    lookup();
  },
  retry() { lookup(); },
  'pay-review'() {
    const invoice=invoices.find(i=>i.person===state.member);
    dialog('Record UPI payment',details([['Member',people[state.member].name],['Invoice',invoice.id],['Amount',money(amount(invoice.amount))]])+dialogActions(button('Confirm recorded payment','pay-done',{kind:'primary',glyph:'check'})));
  },
  'pay-done'() { recordPayment(); },
  status() {
    const invoice = invoices.find(inv=>inv.person===state.member);
    fixture().uncertain = (fixture().uncertain || []).filter(id=>id!==invoice.id);
    persist(); render({focus:'[data-action="receipt"]'}); announce('Payment confirmed. Receipt available.',true);
  },
  receipt(id) { receipt(id); },
  'cancel-review'() {
    dialog('Cancel booking?',`<p>Cancel Aarav Menon’s 19:00 booking at ${siteName('west')}. This will close the booking to payments.</p>${dialogActions(button('Keep booking','close')+button('Confirm cancellation','cancel-done',{kind:'primary'}))}`);
  },
  'cancel-done'() {
    fixture().canceled=true; persist(); closeDialog(); render({focus:'#page-title'}); announce('Booking cancelled. Booking payment is unavailable.',true);
  },
  'booking-payment'() {
    dialog('Booking payment eligibility',details([['Booking','BK-0472'],['Status','Confirmed'],['Payment eligible','Yes'],['Balance',money(amount(1200))]]));
  },
  connection() {
    const f=fixture(); f.offline=!f.offline; persist(); render();
    announce(f.offline?'Offline. Attendance will save on this device.':'Connection restored. Attendance can sync.');
    scheduleSync();
  },
  mark(value) { mark(value); },
  announcement(id) {
    const item=announcements().find(i=>i.id===id);
    if (!item || (state.role==='family' && !familyUpdates(state.child).some(i=>i.id===id))) return;
    dialog(item.title,`<p style="margin-bottom:10px">${item.text}</p>${tag(item.audience)}`);
  }
};
document.addEventListener('click', event => {
  if (event.target.closest('.skip')) {
    event.preventDefault(); $('#main').focus(); return;
  }
  const target = event.target.closest('[data-action]');
  if (target && Object.hasOwn(actions,target.dataset.action)) actions[target.dataset.action](target.dataset.value);
});
document.addEventListener('change', event => {
  const {id,value,checked}=event.target;
  if (id==='role-select') { navigate(value,roles[value].start); return; }
  if (id==='club-select') {
    clearTimeout(syncTimer); clearTimeout(lookupTimer);
    state.club=value; state.scope='all'; state.day=0; state.chart=6; state.direction='';
    state.lookup='failed'; state.memberQuery=''; state.drop=false; state.member='riya'; state.child='riya'; state.urgent=false;
    state.queryToken+=1; persist();
    if (!validPage(state.role,state.page)) navigate(state.role,roles[state.role].start);
    else { render(); scheduleSync(); announce(`Switched to ${club().name}.`); }
    return;
  }
  if (id==='facility') {
    state.scope=value; state.chart=6; render(); announce(`Showing ${scopeLabel()}.`);
  } else if (id==='child') {
    state.child=value; render(); announce(`Showing ${people[value].name}.`);
  } else if (id==='audience') {
    state.viewingAudience=value; render(); announce(`Previewing announcements for ${people[value].name}.`);
  } else if (id==='owner-scenario') {
    state.urgent=value==='cover'; render(); announce(state.urgent?'Coach coverage scenario selected.':'Cash count scenario selected.');
  } else if (id==='payment-connection') state.drop=checked;
});
document.addEventListener('input', event => {
  if (event.target.id==='guardian-query') updateGuardianHits(event.target.value);
  if (event.target.id==='member-query') $('#member-results').innerHTML=memberHits(event.target.value);
});
document.addEventListener('pointerdown', event => {
  if (!event.target.closest('#day-strip') || event.pointerType==='mouse') return;
  gesture={x:event.clientX,y:event.clientY,id:event.pointerId};
});
document.addEventListener('pointerup', event => {
  if (!gesture || gesture.id!==event.pointerId) return;
  const dx=event.clientX-gesture.x, dy=event.clientY-gesture.y;
  gesture=null;
  if (Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)*1.5) changeDay(dx<0?1:-1);
});
document.addEventListener('pointercancel', () => { gesture=null; });
window.addEventListener('hashchange', () => readRoute());
readRoute(true);

</script>
